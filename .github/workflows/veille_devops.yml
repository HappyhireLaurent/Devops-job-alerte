name: Veille DevOps France 🔍

on:
  schedule:
    - cron: "0 6 * * 1"   # Tous les lundis à 7h Paris (6h UTC)
  workflow_dispatch:        # Lancement manuel depuis l'onglet Actions

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout du repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installation des dépendances
        run: pip install requests

      - name: 🔍 Lancement de la veille
        env:
          FT_CLIENT_ID:     ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
