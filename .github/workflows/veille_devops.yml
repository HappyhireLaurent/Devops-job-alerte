name: Veille DevOps France 🔍

on:
  # Tous les lundis à 7h00 heure de Paris (6h UTC en hiver, 5h UTC en été)
  # On met 6h UTC pour couvrir les deux saisons
  schedule:
    - cron: "0 6 * * 1"

  # Permet de lancer manuellement depuis l'onglet Actions (pour tester)
  workflow_dispatch:

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout du repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installation des dépendances
        run: |
          pip install feedparser requests

      - name: 🔍 Lancement de la veille
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
